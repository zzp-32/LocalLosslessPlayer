name: LocalLosslessPlayer
options:
  bundleIdPrefix: com.localplayer
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.7"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  LocalLosslessPlayer:
    type: application
    platform: iOS
    sources:
      - LocalLosslessPlayer
    info:
      path: LocalLosslessPlayer/Info.plist
      properties:
        CFBundleDisplayName: 本地无损音乐
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportsDocumentBrowser: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localplayer.LocalLosslessPlayer
  LocalLosslessPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: LocalLosslessPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localplayer.LocalLosslessPlayerTests
