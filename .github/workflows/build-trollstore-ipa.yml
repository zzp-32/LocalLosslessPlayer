name: Build TrollStore IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned arm64 IPA
        id: ipa-build
        shell: bash
        run: |
          set +e
          bash scripts/build-trollstore-ipa.sh 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              message=${line//'%'/'%25'}
              message=${message//$'\r'/'%0D'}
              message=${message//$'\n'/'%0A'}
              echo "::error title=Xcode build error::$message"
            done < <(grep -E '(^|[[:space:]])(error:|fatal error:)' build.log | tail -20)
          fi
          exit "$status"

      - name: Upload build log on failure
        if: failure() && steps.ipa-build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: build.log
          if-no-files-found: error

      - name: Verify IPA contents
        run: |
          unzip -l LocalLosslessPlayer-TrollStore.ipa
          test "$(unzip -Z1 LocalLosslessPlayer-TrollStore.ipa | grep -c '^Payload/LocalLosslessPlayer.app/LocalLosslessPlayer$')" -eq 1

      - name: Upload TrollStore IPA
        uses: actions/upload-artifact@v4
        with:
          name: LocalLosslessPlayer-TrollStore
          path: LocalLosslessPlayer-TrollStore.ipa
          if-no-files-found: error
